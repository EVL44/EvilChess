spring.application.name=evilchess-server

# Local defaults match infra/docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evilchess}
spring.datasource.username=${DB_USER:evilchess}
spring.datasource.password=${DB_PASSWORD:evilchess}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui

evilchess.version=@version@

# --- Phase 4: accounts, puzzles, sync -------------------------------------
# Access-token signing key (HS256, at least 32 bytes). The default is for
# local development only: set EVILCHESS_JWT_SECRET everywhere else.
evilchess.jwt.secret=${EVILCHESS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
evilchess.jwt.access-ttl=15m
evilchess.jwt.refresh-ttl=60d

# OAuth client IDs (comma-separated). Empty = that sign-in method is off.
evilchess.social.google-client-ids=${EVILCHESS_GOOGLE_CLIENT_IDS:}
evilchess.social.apple-client-ids=${EVILCHESS_APPLE_CLIENT_IDS:}

evilchess.imports.lichess-base-url=https://lichess.org
evilchess.imports.chesscom-base-url=https://api.chess.com
evilchess.imports.user-agent=evilchess-server/0.1 (+https://github.com/EVL44/EvilChess)
evilchess.imports.max-games=2000

evilchess.rate-limit.auth-per-minute=20
evilchess.rate-limit.api-per-minute=600
